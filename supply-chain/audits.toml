[[audits.napi-build]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "2.6.0"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. Build-script helper, no unsafe. Emits cargo link args per target; writes small files only into OUT_DIR; on wasm32-wasi runs `rustc --print sysroot` and a probe compile. Discretion: embeds a prebuilt wasm object (src/wasi_heap_sync_exports.o, C source shipped alongside) that is only linked for wasm32-wasip1-threads with the wasi-heap-sync feature, not for native targets."

[[audits.napi-sys]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "3.4.0"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. Raw Node-API FFI declarations (spot-checked against node_api.h: size_t->usize, length params as isize so NAPI_AUTO_LENGTH=-1). With the default dyn-symbols feature, setup() resolves symbols from the host process (libloading Library::this / node.exe on Windows) into a `static mut` table; stubs return a zeroed napi_status/c_int, never a non-nullable type. Discretion: the static mut table is only sound if setup() runs before any N-API call and not concurrently, which the napi crate guarantees at module registration. wasi_* modules are compiled only for wasm32-wasip1-threads."

