[[audits.simd_cesu8]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "1.2.0"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. CESU-8/MUTF-8 codec used by jni for Java strings (untrusted input). Unsafe reviewed: decode() bounds-checks every get_unchecked (next! checks index<len, surrogate path checks index+4<=len) and only pushes fully validated sequences (no surrogates, no overlongs, paired surrogates rebuilt as 4-byte UTF-8), so String::from_utf8_unchecked is sound; lossy mode never returns Err so unwrap_unchecked is sound; borrowed fast paths are guarded by simdutf8 validation. word.rs unaligned/aligned usize reads stay within [0,len) given the len >= size_of::<usize>() and len >= align_offset guards. simd.rs is nightly-only."

