[[audits.futures-task]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "0.3.31"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. Unsafe reviewed: Arc-based RawWakerVTable keeps refcounts balanced (clone increments via ManuallyDrop clone, wake consumes, wake_by_ref borrows, drop releases); WakerRef copies the Waker with ptr::read under ManuallyDrop and a borrow lifetime; noop_waker_ref casts RawWaker to Waker, relying on Waker being repr(transparent); LocalFutureObj erases the future lifetime but re-binds it with PhantomData<&'a ()>, and each UnsafeFutureObj impl's drop matches its into_raw. No I/O."

[[audits.indexmap]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
delta = "2.14.0 -> 2.14.2"
notes = "AI-assisted review (Claude) of the full cargo vet diff on behalf of the auditor. New map/disjoint.rs moves the existing get_disjoint_mut unsafe: indices are bounds- and duplicate-checked before raw-pointer derefs, so the returned &mut are unique and in-bounds. Index asserts consolidated in util.rs; macros use const blocks."

[[audits.itoa]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
delta = "1.0.15 -> 1.0.18"
notes = "AI-assisted review (Claude) of the full cargo vet diff on behalf of the auditor. Formatting rewritten. Unsafe reviewed: buffer cast in format() targets Buffer arrays <= 40 bytes (i128::MAX_STR_LEN); DECIMAL_PAIRS get_unchecked indices are pair*2+{0,1} with pair < 100 from divmod100 of values < 10000; slice_buffer_to_str only called with offsets produced by bounds-checked contiguous writes from the end of buf, so all bytes from offset are initialized ASCII. Signed path offset math verified for i8..i128."

[[audits.jni-sys]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "0.4.1"
notes = 'AI-assisted review (Claude) of the full crate source on behalf of the auditor. Raw JNI FFI declarations; vtable field order and signatures checked against the JNI spec (variadic Call*Method use extern "C", others extern "system"). Discretion: jboolean is Rust bool (relies on the JVM only producing 0/1, true for HotSpot); va_list is an opaque *mut c_void (only *V entry points affected); the Debug impl for jvalue reads every union member, which reads uninitialized bytes if the value was written via a narrower member, reachable only by Debug-formatting a jvalue.'

[[audits.jni-sys-macros]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "0.4.1"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. Proc macro (no unsafe, no I/O) that expands a struct into versioned #[repr(C)] structs plus a union; fields newer than a version are replaced by *mut c_void padding, which is ABI-correct because every JNI vtable slot is pointer-sized."

