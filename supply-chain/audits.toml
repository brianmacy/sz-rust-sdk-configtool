[[audits.same-file]]
who = "Brian Macy <brian@senzing.com>"
criteria = "safe-to-deploy"
version = "1.0.6"
notes = "AI-assisted review (Claude) of the full crate source on behalf of the auditor. Build-time dependency only (walkdir -> jni build script). Unix: compares (dev, ino) from fstat; stdin/stdout/stderr wrap fds 0/1/2 with File::from_raw_fd and leak them back on drop via into_raw_fd. Windows: delegates to winapi-util handles. Discretion: on Unix, if metadata() fails in from_std the temporary File is dropped and closes the std fd; not reachable here: walkdir, its only consumer in this graph, only calls Handle::from_path (checked walkdir 2.5.0 src)."

