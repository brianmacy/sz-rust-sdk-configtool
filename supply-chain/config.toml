
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.actix]
url = "https://raw.githubusercontent.com/actix/supply-chain/main/audits.toml"

[imports.ariel-os]
url = "https://raw.githubusercontent.com/ariel-os/ariel-os/main/supply-chain/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.fermyon]
url = "https://raw.githubusercontent.com/fermyon/spin/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.combine]]
version = "4.6.8"
criteria = "safe-to-deploy"
notes = "Parser combinators used by jni for JNI type-signature parsing (shipped in the JNI binding). 15 unsafe sites; 18k-line full audit deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher Marwes is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.ctor]]
version = "1.0.13"
criteria = "safe-to-deploy"
notes = "Module-constructor macro/runtime used by napi to register the Node addon at load time (shipped in the Node binding). ~190 unsafe sites incl. link-section constructors; full audit deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher mmastrac is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.jni]]
version = "0.22.4"
criteria = "safe-to-deploy"
notes = "Safe JNI wrapper used directly by bindings/jni (shipped). ~430 unsafe sites; imported audits cover 0.21.1 only and the 0.21.1 -> 0.22.4 delta (~21k insertions) is not reviewed. Its jni-sys and simd_cesu8 dependencies ARE audited here. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher rib is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.jni-macros]]
version = "0.22.4"
criteria = "safe-to-deploy"
notes = "Proc macros of jni 0.22 (generated code contains unsafe JNI calls); 8.6k lines; audit deferred together with jni. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher rib is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.napi]]
version = "3.14.1"
criteria = "safe-to-deploy"
notes = "Node-API safe wrapper used directly by bindings/node (shipped). ~1700 unsafe sites over 32k lines; full audit deferred. Its napi-sys and napi-build dependencies ARE audited here. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from napi-rs/napi-rs is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.napi-derive]]
version = "3.6.11"
criteria = "safe-to-deploy"
notes = "#[napi] proc macro for bindings/node; generated code makes unsafe Node-API calls; 3k lines; audit deferred together with napi-derive-backend. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from napi-rs/napi-rs is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.napi-derive-backend]]
version = "6.1.5"
criteria = "safe-to-deploy"
notes = "Code generator behind napi-derive (proc-macro only, emits unsafe N-API glue); 6k lines; audit deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from napi-rs/napi-rs is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.pyo3]]
version = "0.29.3"
criteria = "safe-to-deploy"
notes = "Python binding framework used directly by bindings/python (shipped). ~1300 unsafe sites over 97k lines; full audit deferred. pyo3-macros (the shim) IS audited here. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from PyO3/pyo3 is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.pyo3-build-config]]
version = "0.29.3"
criteria = "safe-to-deploy"
notes = "Build-time Python interpreter discovery for pyo3 (runs the Python interpreter from build.rs; no shipped code). 5k lines, 2 unsafe sites; audit deferred. Its target-lexicon dependency IS audited here. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from PyO3/pyo3 is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.pyo3-ffi]]
version = "0.29.3"
criteria = "safe-to-deploy"
notes = "Raw CPython C-API declarations used by pyo3 (shipped Python binding). 14k lines / ~370 unsafe FFI items; signature-by-signature check against CPython headers deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from PyO3/pyo3 is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.pyo3-macros-backend]]
version = "0.29.3"
criteria = "safe-to-deploy"
notes = "Code generator behind pyo3-macros (proc-macro only; emits unsafe CPython glue into the shipped Python binding); 13k lines; audit deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: GitHub trusted publishing from PyO3/pyo3 is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.r-efi]]
version = "6.0.0"
criteria = "safe-to-run"
notes = "UEFI definitions pulled by getrandom -> tempfile; DEV-ONLY, compiled only for UEFI targets, safe-to-run criteria; not audited. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher dvdhrm is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."

[[exemptions.serde_yaml_ng]]
version = "0.10.0"
criteria = "safe-to-deploy"
notes = "YAML parsing for the codegen dev tool only (tools/codegen reads api/manifest/*.yaml; publish=false; not in shipped artifacts). 59 unsafe sites; audit deferred. cargo audit (2026-10-25): no advisory. Not covered by trust: publisher acatton is not in any imported audit set's [[trusted]] list (checked 2026-10-25) and has no other reputability evidence on record."
