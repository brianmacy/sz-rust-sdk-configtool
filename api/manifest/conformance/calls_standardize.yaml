# Conformance cases for the `calls_standardize` group. Every case starts from
# the REAL template config (project.yaml paths.fixture). Template facts used:
# 24 CFG_SFCALL rows (ids 1..24); PHONE (FTYPE 6) has SFCALL 4 at order 1;
# NAME has SFCALL 1 (order 1) and 20 (order 50); SFCALL 19 is element-bound
# (COUNTRY, FELEM 28, order 100); LOGIN_ID has no standardize call.
group: calls_standardize

cases:
  # ---- add_standardize_call ----
  - name: add_by_feature_auto_order_then_get_and_list
    steps:
      - fn: add_standardize_call
        args: {sfunc_code: tokenize_name, ftype_code: phone}
        expect:
          kind: config_and_json
          result: {SFCALL_ID: 1000, FTYPE_ID: 6, FELEM_ID: -1, SFUNC_ID: 12, EXEC_ORDER: 2}
      - fn: get_standardize_call
        args: {call: 1000}
        expect:
          result: {SFCALL_ID: 1000, FTYPE_ID: 6, FELEM_ID: -1, SFUNC_ID: 12, EXEC_ORDER: 2}
      - fn: list_standardize_calls
        expect:
          len: 25
          contains:
            - {id: 1000, feature: PHONE, element: n/a, execOrder: 2, function: TOKENIZE_NAME}

  - name: add_by_element_with_all_feature_sentinel
    steps:
      - fn: add_standardize_call
        args: {sfunc_code: STANDARDIZE_COUNTRY, ftype_code: all, felem_code: country}
        expect:
          result: {SFCALL_ID: 1000, FTYPE_ID: -1, FELEM_ID: 28, SFUNC_ID: 11, EXEC_ORDER: 101}
      - fn: list_standardize_calls
        expect:
          contains:
            - {id: 1000, feature: all, element: COUNTRY, execOrder: 101, function: STANDARDIZE_COUNTRY}

  - name: add_na_element_sentinel_is_absent
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: LOGIN_ID, felem_code: N/A}
    expect:
      result: {FTYPE_ID: 13, FELEM_ID: -1, EXEC_ORDER: 1}

  - name: add_explicit_free_order_is_honoured
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: NAME, exec_order: 7}
    expect:
      result: {EXEC_ORDER: 7}

  - name: add_non_positive_order_auto_allocates
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: NAME, exec_order: 0}
    expect:
      result: {EXEC_ORDER: 51}

  - name: add_taken_order_is_already_exists
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: NAME, exec_order: 50}
    expect: {error: ALREADY_EXISTS}

  - name: add_feature_and_element_is_invalid_input
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: NAME, felem_code: COUNTRY}
    expect: {error: INVALID_INPUT}

  - name: add_neither_feature_nor_element_is_invalid_input
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: ALL}
    expect: {error: INVALID_INPUT}

  - name: add_unknown_function_is_not_found
    fn: add_standardize_call
    args: {sfunc_code: NO_SUCH_SFUNC, ftype_code: NAME}
    expect: {error: NOT_FOUND}

  - name: add_unknown_feature_is_not_found
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, ftype_code: NO_SUCH_FEATURE}
    expect: {error: NOT_FOUND}

  - name: add_unknown_element_is_not_found
    fn: add_standardize_call
    args: {sfunc_code: PARSE_ID, felem_code: NO_SUCH_ELEMENT}
    expect: {error: NOT_FOUND}

  - name: add_missing_section
    fn: add_standardize_call
    config_literal: '{"G2_CONFIG": {}}'
    args: {sfunc_code: PARSE_ID, ftype_code: NAME}
    expect: {error: MISSING_SECTION}

  - name: add_invalid_json
    fn: add_standardize_call
    config_literal: "not json"
    args: {sfunc_code: PARSE_ID, ftype_code: NAME}
    expect: {error: JSON_PARSE}

  # ---- delete_standardize_call ----
  - name: delete_then_get_is_not_found
    steps:
      - fn: delete_standardize_call
        args: {sfcall_id: 20}
        expect: {kind: config}
      - fn: get_standardize_call
        args: {call: 20}
        expect: {error: NOT_FOUND}
      - fn: get_standardize_call
        args: {call: NAME}
        expect:
          result: {SFCALL_ID: 1}
      - fn: list_standardize_calls
        expect:
          len: 23
          excludes:
            - {id: 20}

  - name: delete_missing_is_not_found
    fn: delete_standardize_call
    args: {sfcall_id: 9999}
    expect: {error: NOT_FOUND}

  - name: delete_invalid_json
    fn: delete_standardize_call
    config_literal: "not json"
    args: {sfcall_id: 1}
    expect: {error: JSON_PARSE}

  # ---- get_standardize_call ----
  - name: get_by_id
    fn: get_standardize_call
    args: {call: 19}
    expect:
      kind: json
      result: {SFCALL_ID: 19, FTYPE_ID: -1, FELEM_ID: 28, SFUNC_ID: 11, EXEC_ORDER: 100}

  - name: get_by_feature_is_case_insensitive
    fn: get_standardize_call
    args: {call: phone}
    expect:
      result: {SFCALL_ID: 4, FTYPE_ID: 6, SFUNC_ID: 8}

  - name: get_by_ambiguous_feature_is_invalid_input
    fn: get_standardize_call
    args: {call: NAME}
    expect: {error: INVALID_INPUT}

  - name: get_by_feature_without_call_is_not_found
    fn: get_standardize_call
    args: {call: LOGIN_ID}
    expect: {error: NOT_FOUND}

  - name: get_by_unknown_feature_is_not_found
    fn: get_standardize_call
    args: {call: NO_SUCH_FEATURE}
    expect: {error: NOT_FOUND}

  - name: get_missing_id_is_not_found
    fn: get_standardize_call
    args: {call: 9999}
    expect: {error: NOT_FOUND}

  - name: get_invalid_json
    fn: get_standardize_call
    config_literal: "not json"
    args: {call: 1}
    expect: {error: JSON_PARSE}

  # ---- list_standardize_calls ----
  - name: list_template
    fn: list_standardize_calls
    expect:
      kind: json
      len: 24
      contains:
        - {id: 19, feature: all, element: COUNTRY, execOrder: 100, function: STANDARDIZE_COUNTRY}
        - {id: 20, feature: NAME, element: n/a, execOrder: 50, function: TOKENIZE_NAME}

  - name: list_without_sections_is_empty
    fn: list_standardize_calls
    config_literal: '{"G2_CONFIG": {}}'
    expect: {len: 0}

  - name: list_invalid_json
    fn: list_standardize_calls
    config_literal: "not json"
    expect: {error: JSON_PARSE}

  # ---- add_standardize_call_element ----
  - name: add_element_auto_order_then_list
    steps:
      - fn: add_standardize_call_element
        args: {ftype_id: 6, sfunc_id: 12}
        expect:
          kind: config_and_json
          result: {SFCALL_ID: 1000, FTYPE_ID: 6, FELEM_ID: -1, SFUNC_ID: 12, EXEC_ORDER: 2}
      - fn: list_standardize_calls
        expect:
          contains:
            - {id: 1000, feature: PHONE, element: n/a, execOrder: 2, function: TOKENIZE_NAME}

  - name: add_element_explicit_order_and_felem
    fn: add_standardize_call_element
    args: {ftype_id: -1, sfunc_id: 6, felem_id: 28, exec_order: 5}
    expect:
      result: {FTYPE_ID: -1, FELEM_ID: 28, EXEC_ORDER: 5}

  - name: add_element_duplicate_is_already_present
    fn: add_standardize_call_element
    args: {ftype_id: 1, sfunc_id: 1}
    expect: {error: ALREADY_PRESENT}

  - name: add_element_taken_order_is_already_exists
    fn: add_standardize_call_element
    args: {ftype_id: 6, sfunc_id: 12, exec_order: 1}
    expect: {error: ALREADY_EXISTS}

  - name: add_element_missing_section
    fn: add_standardize_call_element
    config_literal: '{"G2_CONFIG": {}}'
    args: {ftype_id: 6, sfunc_id: 12}
    expect: {error: MISSING_SECTION}

  - name: add_element_invalid_json
    fn: add_standardize_call_element
    config_literal: "not json"
    args: {ftype_id: 6, sfunc_id: 12}
    expect: {error: JSON_PARSE}

  # ---- delete_standardize_call_element ----
  - name: delete_element_then_get_is_not_found
    steps:
      - fn: delete_standardize_call_element
        args: {ftype_id: 1, sfunc_id: 1}
        expect: {kind: config}
      - fn: get_standardize_call
        args: {call: 1}
        expect: {error: NOT_FOUND}
      - fn: list_standardize_calls
        expect:
          len: 23

  - name: delete_element_by_felem
    steps:
      - fn: delete_standardize_call_element
        args: {ftype_id: -1, sfunc_id: 11, felem_id: 28}
      - fn: get_standardize_call
        args: {call: 19}
        expect: {error: NOT_FOUND}

  - name: delete_element_missing_is_not_found
    fn: delete_standardize_call_element
    args: {ftype_id: 1, sfunc_id: 2}
    expect: {error: NOT_FOUND}

  - name: delete_element_invalid_json
    fn: delete_standardize_call_element
    config_literal: "not json"
    args: {ftype_id: 1, sfunc_id: 1}
    expect: {error: JSON_PARSE}
