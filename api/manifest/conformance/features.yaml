      - fn: set_feature
        args: {feature: email, candidates: "yes", matchkey: confirm, behavior: f1e, class: other, version: 9}
        expect: {kind: config}
      - fn: get_feature
        args: {feature: EMAIL}
        expect:
          result: {candidates: "Yes", matchKey: Confirm, behavior: F1E, class: OTHER, version: 9}

  - name: set_anonymize_is_stored_verbatim
