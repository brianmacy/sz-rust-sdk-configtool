      - fn: get_feature_comparison
        args: {feature_code: EMAIL, element_code: ADDR}
        expect: {error: NOT_FOUND}
      - fn: list_feature_comparisons
        expect: {len: 222}

  - name: delete_comparison_absent_mapping_is_not_found
