  # ----------------------------------------------------- update_feature_version
  # No manifest function reads FEATURE_VERSION back; success is checked by kind
  # and by the config still being usable afterwards.
  - name: update_feature_version_succeeds
    steps:
      - fn: update_feature_version
        args: {version: "11"}
        expect: {kind: config}
      - fn: get_feature
        args: {feature: NAME}
        expect:
          result: {id: 1}

  - name: update_feature_version_without_compat_is_missing_section
    fn: update_feature_version
    config_literal: '{"G2_CONFIG": {"CONFIG_BASE_VERSION": {}}}'
    args: {version: "11"}
    expect: {error: MISSING_SECTION}

  - name: update_feature_version_on_array_config_is_missing_section
    fn: update_feature_version
    config_literal: '[]'
    args: {version: "11"}
    expect: {error: MISSING_SECTION}

  - name: update_feature_version_invalid_config_is_json_parse
    fn: update_feature_version
    config_literal: "not json"
    args: {version: "11"}
    expect: {error: JSON_PARSE}
