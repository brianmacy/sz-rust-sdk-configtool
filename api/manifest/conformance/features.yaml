        expect: {kind: config}
      - fn: get_feature_comparison
        args: {feature_code: EMAIL, element_code: MAKE}
        expect:
          result: {FTYPE_ID: 14, FELEM_ID: 14, EXEC_ORDER: 27, DISPLAY_LEVEL: null, DISPLAY_DELIM: "|", DERIVED: null}

  - name: add_comparison_values_stored_verbatim
    steps:
      - fn: add_feature_comparison
        args: {feature_code: EMAIL, element_code: MAKE, exec_order: 100, display_level: -3, derived: whatever}
      - fn: get_feature_comparison
        args: {feature_code: EMAIL, element_code: MAKE}
        expect:
          result: {EXEC_ORDER: 100, DISPLAY_LEVEL: -3, DERIVED: whatever}

  - name: add_comparison_zero_order_auto_allocates
    steps:
      - fn: add_feature_comparison
        args: {feature_code: EMAIL, element_code: MAKE, exec_order: 0}
      - fn: get_feature_comparison
        args: {feature_code: EMAIL, element_code: MAKE}
        expect:
          result: {EXEC_ORDER: 27}

  - name: add_comparison_taken_order_is_already_exists
    fn: add_feature_comparison
    args: {feature_code: EMAIL, element_code: MAKE, exec_order: 1}
    expect: {error: ALREADY_EXISTS}

  - name: add_comparison_duplicate_is_already_exists
    fn: add_feature_comparison
    args: {feature_code: EMAIL, element_code: ADDR}
    expect: {error: ALREADY_EXISTS}

  - name: add_comparison_unknown_feature_is_not_found
    fn: add_feature_comparison
    args: {feature_code: NOPE, element_code: MAKE}
    expect: {error: NOT_FOUND}

  - name: add_comparison_unknown_element_is_not_found
