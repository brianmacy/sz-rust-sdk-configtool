# Conformance cases for the `features` group. Every case starts from the
# REAL template config (project.yaml paths.fixture). See schema.md
# ("Conformance files") for the step/expect semantics.
group: features

cases:
  # ---------------------------------------------------------------- add_feature
  - name: add_existing_element_with_non_integer_id_is_invalid_structure
    fn: add_feature
    config_literal: '{"G2_CONFIG": {"CFG_FTYPE": [], "CFG_FCLASS": [{"FCLASS_ID": 7, "FCLASS_CODE": "OTHER"}], "CFG_FELEM": [{"FELEM_ID": "x", "FELEM_CODE": "E1"}], "CFG_FBOM": []}}'
    args: {feature: F1, element_list: [E1]}
    expect: {error: INVALID_STRUCTURE}

  - name: add_defaults_auto_create_element_and_fbom_order
    steps:
      - fn: add_feature
        args:
          feature: my_feat
          element_list:
            - my_new_elem
            - {element: full_name, display_level: 0, derived: "yes", displaydelim: "|"}
        expect: {kind: config}
      - fn: get_feature
        args: {feature: MY_FEAT}
        expect:
          kind: json
          result:
            id: 1000
            feature: MY_FEAT
            class: OTHER
            behavior: FM
            anonymize: "No"
            candidates: "No"
            standardize: ""
            expression: ""
            comparison: ""
            matchKey: "No"
            version: 1
            elementList:
              - {element: MY_NEW_ELEM, expressed: "No", compared: "No", derived: "No", display: "Yes"}
              - {element: FULL_NAME, expressed: "No", compared: "No", derived: "Yes", display: "No"}
      - fn: get_element
        args: {code: MY_NEW_ELEM}
        expect:
          result: {id: 1000, element: MY_NEW_ELEM, datatype: string}
      - fn: get_feature_comparison
        args: {feature_code: MY_FEAT, element_code: FULL_NAME}
        expect:
          result: {FTYPE_ID: 1000, FELEM_ID: 2, EXEC_ORDER: 2, DISPLAY_LEVEL: 0, DISPLAY_DELIM: "|", DERIVED: "Yes"}

  - name: add_full_with_functions_and_explicit_id
    steps:
      - fn: add_feature
        args:
          feature: F_FULL
          element_list:
            - {element: FULL_NAME, expressed: "Yes", compared: "yes"}
          class: name
          behavior: f1es
          candidates: "yes"
          anonymize: "NO"
          derived: "no"
          history: "no"
          standardize: parse_name
          expression: name_hasher
          comparison: str_comp
          version: 3
          rtype_id: 0
          id: 5000
      - fn: get_feature
        args: {feature: "5000"}
        expect:
          result:
            id: 5000
            feature: F_FULL
            class: NAME
            behavior: F1ES
            anonymize: "No"
            candidates: "Yes"
            standardize: PARSE_NAME
            expression: NAME_HASHER
            comparison: STR_COMP
            matchKey: "Yes"
            version: 3
            elementList:
              - {element: FULL_NAME, expressed: "Yes", compared: "Yes"}

  - name: add_explicit_matchkey_overrides_default
    steps:
      - fn: add_feature
        args: {feature: F_MK, element_list: [FULL_NAME], matchkey: denial}
      - fn: get_feature
        args: {feature: F_MK}
        expect:
          result: {matchKey: Denial}

  - name: add_non_positive_id_auto_allocates
    steps:
      - fn: add_feature
        args: {feature: F_NEG, element_list: [FULL_NAME], id: -5}
      - fn: get_feature
        args: {feature: F_NEG}
        expect:
          result: {id: 1000}

  - name: add_duplicate_is_already_exists
    fn: add_feature
    args: {feature: name, element_list: [FULL_NAME]}
    expect: {error: ALREADY_EXISTS}

  - name: add_taken_id_is_already_exists
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], id: 1}
    expect: {error: ALREADY_EXISTS}

  - name: add_empty_element_list_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: []}
    expect: {error: INVALID_INPUT}

  - name: add_non_array_element_list_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: FULL_NAME}
    expect: {error: INVALID_INPUT}

  - name: add_element_object_without_code_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [{expressed: "Yes"}]}
    expect: {error: INVALID_INPUT}

  - name: add_negative_display_level_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [{element: FULL_NAME, display_level: -1}]}
    expect: {error: INVALID_INPUT}

  - name: add_bad_element_derived_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [{element: FULL_NAME, derived: maybe}]}
    expect: {error: INVALID_INPUT}

  - name: add_bad_candidates_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], candidates: maybe}
    expect: {error: INVALID_INPUT}

  - name: add_bad_history_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], history: maybe}
    expect: {error: INVALID_INPUT}

  - name: add_bad_matchkey_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], matchkey: sometimes}
    expect: {error: INVALID_INPUT}

  - name: add_bad_behavior_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], behavior: BOGUS}
    expect: {error: INVALID_INPUT}

  - name: add_unknown_class_is_not_found
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], class: NO_SUCH_CLASS}
    expect: {error: NOT_FOUND}

  - name: add_empty_standardize_is_not_found
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], standardize: ""}
    expect: {error: NOT_FOUND}

  - name: add_comparison_without_compared_element_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], comparison: STR_COMP}
    expect: {error: INVALID_INPUT}

  - name: add_expression_without_expressed_element_is_invalid_input
    fn: add_feature
    args: {feature: F_X, element_list: [FULL_NAME], expression: NAME_HASHER}
    expect: {error: INVALID_INPUT}

  - name: add_invalid_config_is_json_parse
    fn: add_feature
    config_literal: "not json"
    args: {feature: F_X, element_list: [FULL_NAME]}
    expect: {error: JSON_PARSE}

  - name: add_missing_ftype_section
    fn: add_feature
    config_literal: '{"G2_CONFIG": {}}'
    args: {feature: F_X, element_list: [FULL_NAME]}
    expect: {error: MISSING_SECTION}

  # ------------------------------------------------------------- delete_feature
  - name: delete_cascades_fbom_and_attributes_keeps_elements
    steps:
      - fn: delete_feature
        args: {feature: email}
        expect: {kind: config}
      - fn: get_feature
        args: {feature: EMAIL}
        expect: {error: NOT_FOUND}
      - fn: get_attribute
        args: {code: EMAIL_ADDRESS}
        expect: {error: NOT_FOUND}
      - fn: list_feature_comparisons
        expect:
          len: 218
          excludes:
            - {FTYPE_ID: 14}
      - fn: list_elements
        expect: {len: 118}

  - name: delete_by_numeric_id
    steps:
      - fn: delete_feature
        args: {feature: " 14 "}
      - fn: get_feature
        args: {feature: EMAIL}
        expect: {error: NOT_FOUND}

  - name: delete_locked_is_invalid_input
    fn: delete_feature
    args: {feature: name}
    expect: {error: INVALID_INPUT}

  - name: delete_missing_code_is_not_found
    fn: delete_feature
    args: {feature: NOPE}
    expect: {error: NOT_FOUND}

  - name: delete_missing_id_is_not_found
    fn: delete_feature
    args: {feature: "9999"}
    expect: {error: NOT_FOUND}

  - name: delete_id_without_section_is_missing_section
    fn: delete_feature
    config_literal: '{"G2_CONFIG": {}}'
    args: {feature: "14"}
    expect: {error: MISSING_SECTION}

  - name: delete_invalid_config_is_json_parse
    fn: delete_feature
    config_literal: "not json"
    args: {feature: EMAIL}
    expect: {error: JSON_PARSE}

  # ---------------------------------------------------------------- get / list
  - name: get_by_trimmed_id
    fn: get_feature
    args: {feature: " 1 "}
    expect:
      result: {id: 1, feature: NAME, class: NAME, behavior: NAME, matchKey: "Yes", version: 2}

  - name: get_missing_is_not_found
    fn: get_feature
    args: {feature: nope}
    expect: {error: NOT_FOUND}

  - name: get_without_section_is_not_found
    fn: get_feature
    config_literal: '{"G2_CONFIG": {}}'
    args: {feature: NAME}
    expect: {error: NOT_FOUND}

  - name: get_invalid_config_is_json_parse
    fn: get_feature
    config_literal: "not json"
    args: {feature: NAME}
    expect: {error: JSON_PARSE}

  - name: list_template
    fn: list_features
    expect:
      kind: json
      len: 72
      contains:
        - {id: 1, feature: NAME, class: NAME, behavior: NAME}
        - {id: 14, feature: EMAIL, behavior: F1}

  - name: list_without_section_is_missing_section
    fn: list_features
    config_literal: '{"G2_CONFIG": {}}'
    expect: {error: MISSING_SECTION}

  - name: list_invalid_config_is_json_parse
    fn: list_features
    config_literal: "not json"
    expect: {error: JSON_PARSE}

  # ---------------------------------------------------------------- set_feature
  - name: set_normalizes_and_writes
