      - fn: set_feature
        args: {feature: "14", anonymize: maybe, derived: "yes", history: "no", rtype_id: 7}
      - fn: get_feature
        args: {feature: EMAIL}
        expect:
          result: {anonymize: maybe}

  - name: set_without_updates_is_invalid_input
    fn: set_feature
    args: {feature: EMAIL}
    expect: {error: INVALID_INPUT}

  - name: set_same_value_is_invalid_input
