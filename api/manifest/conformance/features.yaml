    args: {feature: EMAIL, matchkey: sometimes}
    expect: {error: INVALID_INPUT}

  - name: set_bad_behavior_is_invalid_input
    fn: set_feature
    args: {feature: EMAIL, behavior: BOGUS}
    expect: {error: INVALID_INPUT}

  - name: set_unknown_class_is_not_found
    fn: set_feature
    args: {feature: EMAIL, class: NO_SUCH_CLASS}
    expect: {error: NOT_FOUND}

  - name: set_missing_code_is_not_found
    fn: set_feature
    args: {feature: NOPE, version: 2}
    expect: {error: NOT_FOUND}

  - name: set_missing_id_is_not_found
    fn: set_feature
