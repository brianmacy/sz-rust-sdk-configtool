  - name: delete_comparison_unknown_feature_is_not_found
    fn: delete_feature_comparison
    args: {feature_code: NOPE, element_code: MAKE}
    expect: {error: NOT_FOUND}

  - name: delete_comparison_without_fbom_is_not_found
    fn: delete_feature_comparison
    config_literal: '{"G2_CONFIG": {"CFG_FTYPE": [{"FTYPE_ID": 1, "FTYPE_CODE": "NAME"}], "CFG_FELEM": [{"FELEM_ID": 2, "FELEM_CODE": "FULL_NAME"}]}}'
    args: {feature_code: NAME, element_code: FULL_NAME}
    expect: {error: NOT_FOUND}

  - name: delete_comparison_invalid_config_is_json_parse
    fn: delete_feature_comparison
    config_literal: "not json"
    args: {feature_code: NAME, element_code: FULL_NAME}
    expect: {error: JSON_PARSE}

  - name: get_comparison_raw_row
    fn: get_feature_comparison
    args: {feature_code: name, element_code: full_name}
    expect:
      kind: json
      result: {FTYPE_ID: 1, FELEM_ID: 2, EXEC_ORDER: 1, DISPLAY_LEVEL: 1, DISPLAY_DELIM: null, DERIVED: "No"}

  - name: get_comparison_absent_mapping_is_not_found
    fn: get_feature_comparison
    args: {feature_code: NAME, element_code: MAKE}
    expect: {error: NOT_FOUND}

  - name: get_comparison_without_fbom_is_missing_section
    fn: get_feature_comparison
    config_literal: '{"G2_CONFIG": {"CFG_FTYPE": [{"FTYPE_ID": 1, "FTYPE_CODE": "NAME"}], "CFG_FELEM": [{"FELEM_ID": 2, "FELEM_CODE": "FULL_NAME"}]}}'
    args: {feature_code: NAME, element_code: FULL_NAME}
    expect: {error: MISSING_SECTION}

  - name: get_comparison_invalid_config_is_json_parse
    fn: get_feature_comparison
    config_literal: "not json"
    args: {feature_code: NAME, element_code: FULL_NAME}
    expect: {error: JSON_PARSE}

  - name: list_comparisons_template
    fn: list_feature_comparisons
    expect:
      kind: json
      len: 223
      contains:
        - {FTYPE_ID: 1, FELEM_ID: 2, EXEC_ORDER: 1}

  - name: list_comparisons_without_fbom_is_missing_section
    fn: list_feature_comparisons
    config_literal: '{"G2_CONFIG": {}}'
    expect: {error: MISSING_SECTION}

  - name: list_comparisons_invalid_config_is_json_parse
    fn: list_feature_comparisons
    config_literal: "not json"
    expect: {error: JSON_PARSE}

  # ----------------------------------------------------- distinct call element
  - name: add_distinct_call_then_duplicate
    steps:
      - fn: add_feature_distinct_call_element
        args: {feature_code: email, distinct_func_code: felem_strict_subset, element_code: make, exec_order: 5}
        expect: {kind: config}
      - fn: add_feature_distinct_call_element
        args: {feature_code: EMAIL, distinct_func_code: FELEM_STRICT_SUBSET}
        expect: {error: ALREADY_EXISTS}

  # Template: 14 CFG_DFCALL rows, max DFCALL_ID 37; EMAIL = FTYPE 14 (no
  # distinct call); FELEM_STRICT_SUBSET = DFUNC 1.
  - name: add_distinct_call_traps_element_and_exec_order_ignored_id_floor
    steps:
      - fn: add_feature_distinct_call_element
        args: {feature_code: email, distinct_func_code: felem_strict_subset, element_code: make, exec_order: 5}
      # Id floor 1000 (max 37 + 1 < 1000); the row is exactly {id, feature, function}.
      - fn: get_distinct_call
        args: {call: 1000}
        expect:
          result: {DFCALL_ID: 1000, FTYPE_ID: 14, DFUNC_ID: 1}
      # element_code is NOT stored (no CFG_DFBOM row) and exec_order 5 is
      # ignored (execOrder renders the schema default 1).
      - fn: list_distinct_calls
        expect:
          len: 15
          contains:
            - {id: 1000, feature: EMAIL, function: FELEM_STRICT_SUBSET, execOrder: 1, elementList: []}
      # Next id is max + 1 once above the floor.
      - fn: add_feature_distinct_call_element
        args: {feature_code: WEBSITE, distinct_func_code: FELEM_STRICT_SUBSET}
      - fn: get_distinct_call
        args: {call: WEBSITE}
        expect:
          result: {DFCALL_ID: 1001, DFUNC_ID: 1}

  - name: add_distinct_call_existing_pair_is_already_exists
    fn: add_feature_distinct_call_element
    args: {feature_code: NAME, distinct_func_code: PARTIAL_NAMES}
    expect: {error: ALREADY_EXISTS}

  - name: add_distinct_call_unknown_function_is_not_found
    fn: add_feature_distinct_call_element
    args: {feature_code: EMAIL, distinct_func_code: NOPE}
    expect: {error: NOT_FOUND}

  - name: add_distinct_call_unknown_element_is_not_found
