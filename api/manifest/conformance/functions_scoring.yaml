# Conformance for functions_scoring: every exported placeholder returns NOT_IMPLEMENTED.
group: functions_scoring

cases:
  - name: add_is_not_implemented
    fn: add_scoring_function
    args: {rtype_code: EXACTLY_ONE, scoring_func: X}
    expect: {error: NOT_IMPLEMENTED}

  - name: delete_is_not_implemented
    fn: delete_scoring_function
    args: {rtype_code: EXACTLY_ONE}
    expect: {error: NOT_IMPLEMENTED}

  - name: get_is_not_implemented
    fn: get_scoring_function
    args: {rtype_code: EXACTLY_ONE}
    expect: {error: NOT_IMPLEMENTED}

  - name: list_is_not_implemented
    fn: list_scoring_functions
    expect: {error: NOT_IMPLEMENTED}

  - name: set_is_not_implemented
    fn: set_scoring_function
    args: {rtype_code: EXACTLY_ONE, scoring_func: X}
    expect: {error: NOT_IMPLEMENTED}

  - name: set_without_optional_is_not_implemented
    fn: set_scoring_function
    args: {rtype_code: EXACTLY_ONE}
    expect: {error: NOT_IMPLEMENTED}

  - name: invalid_config_still_not_implemented
    fn: list_scoring_functions
    config_literal: "not json"
    expect: {error: NOT_IMPLEMENTED}
