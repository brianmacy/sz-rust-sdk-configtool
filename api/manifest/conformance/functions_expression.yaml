# Conformance cases for the `functions_expression` group (CFG_EFUNC). Every
# case starts from the REAL template config (project.yaml paths.fixture).
group: functions_expression

cases:
  - name: add_returns_config_and_record
    steps:
      - fn: add_expression_function
        args: {code: my_exp, connect_str: g2MyExp, description: My exp, language: C}
        expect:
          kind: config_and_json
          result: {EFUNC_ID: 10, EFUNC_CODE: MY_EXP, CONNECT_STR: g2MyExp, EFUNC_DESC: My exp, LANGUAGE: C}
      - fn: get_expression_function
        args: {code: MY_EXP}
        expect:
          kind: json
          result: {EFUNC_ID: 10, EFUNC_CODE: MY_EXP, CONNECT_STR: g2MyExp, EFUNC_DESC: My exp, LANGUAGE: C}
      - fn: list_expression_functions
        expect:
          len: 10
          contains:
            - {id: 10, function: MY_EXP, connectStr: g2MyExp, language: C}

  - name: add_absent_optionals_store_null
    fn: add_expression_function
    args: {code: BARE_EXP}
    expect:
      result: {EFUNC_ID: 10, EFUNC_CODE: BARE_EXP, CONNECT_STR: null, EFUNC_DESC: null, LANGUAGE: null}

  - name: add_empty_connect_str_is_stored_verbatim
    fn: add_expression_function
    args: {code: EMPTY_EXP, connect_str: ""}
    expect:
      result: {CONNECT_STR: ""}

  - name: add_duplicate_is_invalid_input
    fn: add_expression_function
    args: {code: name_hasher}
    expect: {error: INVALID_INPUT}

  - name: add_missing_section_is_missing_section
    fn: add_expression_function
    config_literal: '{"G2_CONFIG": {}}'
    args: {code: X}
    expect: {error: MISSING_SECTION}

  - name: add_invalid_config_is_json_parse
    fn: add_expression_function
    config_literal: "not json"
    args: {code: X}
    expect: {error: JSON_PARSE}

  - name: get_is_case_insensitive
    fn: get_expression_function
    args: {code: name_hasher}
    expect:
      result: {EFUNC_ID: 2, EFUNC_CODE: NAME_HASHER, EFUNC_DESC: Name expression, CONNECT_STR: g2NameHasher, LANGUAGE: null}

  - name: get_missing_is_not_found
    fn: get_expression_function
    args: {code: NOPE}
    expect: {error: NOT_FOUND}

  - name: get_missing_section_is_not_found
    fn: get_expression_function
    config_literal: '{"G2_CONFIG": {}}'
    args: {code: NAME_HASHER}
    expect: {error: NOT_FOUND}

  - name: get_invalid_config_is_json_parse
    fn: get_expression_function
    config_literal: "not json"
    args: {code: NAME_HASHER}
    expect: {error: JSON_PARSE}

  - name: list_template
    fn: list_expression_functions
    expect:
      kind: json
      len: 9
      contains:
        - {id: 2, function: NAME_HASHER, connectStr: g2NameHasher, language: null}
        - {id: 9, function: CREDITCARD_EFEAT, connectStr: g2CreditCardECreator, language: null}

  - name: list_missing_section_is_empty
    fn: list_expression_functions
    config_literal: '{"G2_CONFIG": {}}'
    expect: {len: 0}

  - name: list_invalid_config_is_json_parse
    fn: list_expression_functions
    config_literal: "not json"
    expect: {error: JSON_PARSE}

  - name: delete_returns_row_then_get_is_not_found
    steps:
      - fn: delete_expression_function
        args: {code: express_id}
        expect:
          kind: config_and_json
          result: {EFUNC_ID: 5, EFUNC_CODE: EXPRESS_ID}
      - fn: get_expression_function
        args: {code: EXPRESS_ID}
        expect: {error: NOT_FOUND}
      - fn: list_expression_functions
        expect:
          len: 8
          excludes:
            - {function: EXPRESS_ID}

  - name: delete_missing_is_not_found
    fn: delete_expression_function
    args: {code: NOPE}
    expect: {error: NOT_FOUND}

  - name: delete_invalid_config_is_json_parse
    fn: delete_expression_function
    config_literal: "not json"
    args: {code: EXPRESS_ID}
    expect: {error: JSON_PARSE}

  - name: cascade_returns_row_then_get_is_not_found
    steps:
      - fn: delete_expression_function_cascade
        args: {code: express_id}
        expect:
          kind: config_and_json
          result: {EFUNC_ID: 5, EFUNC_CODE: EXPRESS_ID, CONNECT_STR: g2IDHasher}
      - fn: get_expression_function
        args: {code: EXPRESS_ID}
        expect: {error: NOT_FOUND}
      - fn: list_expression_functions
        expect:
          len: 8
          excludes:
            - {function: EXPRESS_ID}

  - name: cascade_removes_dependent_calls_and_boms
    steps:
      - fn: get_config_section
        args: {section_name: CFG_EFBOM, filter: '"EFCALL_ID": 2,'}
        expect: {len: 1}
      - fn: delete_expression_function_cascade
        args: {code: express_id}
      - fn: list_expression_calls
        expect:
          len: 15
          excludes: [{function: EXPRESS_ID}, {function: unknown}]
      - fn: get_expression_call
        args: {call: 2}
        expect: {error: NOT_FOUND}
      - fn: get_config_section
        args: {section_name: CFG_EFBOM}
        expect: {len: 114}
      - fn: get_config_section
        args: {section_name: CFG_EFBOM, filter: '"EFCALL_ID": 2,'}
        expect: {len: 0}

  - name: plain_delete_leaves_dependent_calls_and_boms
    steps:
      - fn: delete_expression_function
        args: {code: express_id}
      - fn: list_expression_calls
        expect:
          len: 28
          contains: [{id: 2, function: unknown, elementList: [ID_NUM_STD]}]
      - fn: get_config_section
        args: {section_name: CFG_EFBOM}
        expect: {len: 127}

  - name: cascade_missing_is_not_found
    fn: delete_expression_function_cascade
    args: {code: NOPE}
    expect: {error: NOT_FOUND}

  - name: cascade_row_without_id_is_missing_field
    fn: delete_expression_function_cascade
    config_literal: '{"G2_CONFIG": {"CFG_EFUNC": [{"EFUNC_CODE": "NO_ID"}], "CFG_EFCALL": []}}'
    args: {code: no_id}
    expect: {error: MISSING_FIELD}

  - name: cascade_invalid_config_is_json_parse
    fn: delete_expression_function_cascade
    config_literal: "not json"
    args: {code: EXPRESS_ID}
    expect: {error: JSON_PARSE}

  - name: set_writes_and_returns_row
    steps:
      - fn: set_expression_function
        args: {code: name_hasher, connect_str: g2New, description: New desc, language: C}
        expect:
          kind: config_and_json
          result: {EFUNC_ID: 2, EFUNC_CODE: NAME_HASHER, CONNECT_STR: g2New, EFUNC_DESC: New desc, LANGUAGE: C}
      - fn: get_expression_function
        args: {code: NAME_HASHER}
        expect:
          result: {CONNECT_STR: g2New, EFUNC_DESC: New desc, LANGUAGE: C}

  - name: set_connect_str_null_clears
    steps:
      - fn: set_expression_function
        args: {code: NAME_HASHER, connect_str: null}
      - fn: get_expression_function
        args: {code: NAME_HASHER}
        expect:
          result: {CONNECT_STR: null, EFUNC_DESC: Name expression}

  - name: set_absent_leaves_fields
    steps:
      - fn: set_expression_function
        args: {code: NAME_HASHER, language: C}
      - fn: get_expression_function
        args: {code: NAME_HASHER}
        expect:
          result: {CONNECT_STR: g2NameHasher, EFUNC_DESC: Name expression, LANGUAGE: C}

  - name: set_missing_is_not_found
    fn: set_expression_function
    args: {code: NOPE, language: C}
    expect: {error: NOT_FOUND}

  - name: set_invalid_config_is_json_parse
    fn: set_expression_function
    config_literal: "not json"
    args: {code: NAME_HASHER}
    expect: {error: JSON_PARSE}
