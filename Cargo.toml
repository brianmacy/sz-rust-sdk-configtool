[workspace]
members = [".", "api", "ffi", "tools/codegen", "bindings/python", "bindings/jni", "bindings/node"]
# Plain `cargo build`/`cargo test` at the root stays scoped to the pure library;
# use `--workspace` (or `-p sz-configtool-ffi`) to include the C FFI crate.
default-members = ["."]
resolver = "3"

[workspace.package]
version = "4.4.0-1"
edition = "2024"
rust-version = "1.88"
authors = ["Brian Macy <bmacy@senzing.com>"]
license = "Apache-2.0"
repository = "https://github.com/brianmacy/sz-rust-sdk-configtool"

[package]
name = "sz_configtool_lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Pure Rust library for manipulating Senzing configuration JSON documents"
license.workspace = true
repository.workspace = true
keywords = ["senzing", "configuration", "json", "entity-resolution"]
categories = ["config", "data-structures"]
readme = "README.md"

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.27"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
