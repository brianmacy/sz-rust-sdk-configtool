name: Release

# Full cross-platform matrix: only on a version tag push (publishes a GitHub
# Release) or a manual dispatch (DRY RUN, from any branch or tag: builds,
# gates, assembles every release asset + SHA256SUMS exactly as a release
# would and uploads them as the `release-assets` workflow artifact, and prints
# the release notes (CHANGELOG.md section of the version); it never attests or
# publishes). Publishing is gated on the EVENT, not the ref:
# `github.ref_type == 'tag'` alone is also true for a dispatch on a tag.
# Nothing is pushed to any package registry. Every step is a packaging/
# script; see packaging/README.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Version gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Workspace / binding / tag versions agree
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          packaging/gates/test-version-spellings.sh
          packaging/gates/check-versions.sh "${TAG}"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner images = GitHub-hosted equivalents of G2's build legs
          # (packaging/README.md "Toolchain alignment").
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-26
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned tools (sha256/sha512-verified)
        run: packaging/install-tools.sh "${{ matrix.target }}"
      - name: Build natives
        run: packaging/release-target.sh "${{ matrix.target }}" build
      - name: Gates (exports, linkage, glibc, build paths, C tests)
        run: packaging/release-target.sh "${{ matrix.target }}" gates
      - name: Package (C archive + embedded SBOM, Linux wheel, npm tarball, C++ package + ctest)
        run: packaging/release-target.sh "${{ matrix.target }}" package
      - name: Gates on packaged artifacts
        run: packaging/release-target.sh "${{ matrix.target }}" gates
      - name: Binding smoke tests against the staged natives
        run: packaging/release-target.sh "${{ matrix.target }}" smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            target/dist/${{ matrix.target }}/out
            target/dist/${{ matrix.target }}/native
          if-no-files-found: error
          retention-days: 14

  universal:
    name: Java jar, NuGet package, tRPC tarball
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/dist
      - name: Install pinned tools
        run: packaging/install-tools.sh linux-x64 rust python jdk maven node
      - name: Java jar (all natives bundled; tests vs linux-x64)
        run: packaging/package-java.sh linux-x64
      - name: NuGet package (all RIDs required)
        run: packaging/package-dotnet.sh
      - name: tRPC tarball (tests vs linux-x64 .node)
        run: packaging/package-node.sh --trpc linux-x64
      - name: No build paths in universal artifacts
        run: packaging/gates/check-no-build-paths.sh target/dist/universal/out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: universal
          path: target/dist/universal/out
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Release assets + SHA256SUMS (also the dry run)
    needs: [build, universal]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # Version for the asset-set gate and the release notes (cargo metadata).
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # No standalone SBOM (the C archive embeds its own under sbom/) and no
      # attestation bundle is ever a release asset. Python wheels come from
      # the Linux legs only (config.yaml python_wheel).
      # check-release-assets.sh fails on any missing or extra asset, and
      # explicitly on any *.cdx.json / *.intoto.jsonl
      # (self-test: gates/test-release-assets.sh, run in ci.yml).
      - name: Collect release assets + SHA256SUMS
        run: |
          mkdir -p release
          cp artifacts/universal/* release/
          for t in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            cp "artifacts/${t}/out/"* release/
          done
          packaging/make-sums.sh release
          packaging/gates/check-release-assets.sh release
          ls -la release
      # The GitHub Release body = the CHANGELOG.md section of the version
      # (release-notes.sh fails when it is missing or empty). A tag push uses
      # the tag (preflight checked it equals v<workspace version>); a dispatch
      # uses v<workspace version>. Printed here, so a dry run shows the notes.
      - name: Release notes (CHANGELOG.md section)
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # shellcheck source=packaging/lib/common.sh
          source packaging/lib/common.sh
          tag="${TAG:-v$(workspace_version)}"
          mkdir -p notes
          packaging/release-notes.sh "${tag}" >notes/notes.md
          echo "----- release notes for ${tag} -----"
          cat notes/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    # Only a tag PUSH publishes; a workflow_dispatch (even on a tag) stops at
    # `assemble`.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      # No checkout here, so not check-release-assets.sh (assemble ran it):
      # re-check that release/ is exactly SHA256SUMS + the files it lists,
      # with no SBOM or attestation bundle among them.
      - name: Verify SHA256SUMS and the asset set
        working-directory: release
        run: |
          sha256sum -c --strict SHA256SUMS
          listed="$(sed 's/^[0-9a-f]\{64\} [ *]//' SHA256SUMS | LC_ALL=C sort)"
          present="$(find . -mindepth 1 ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort)"
          if [[ "${listed}" != "${present}" ]]; then
            echo "::error::release/ is not exactly the files in SHA256SUMS"
            diff <(echo "${listed}") <(echo "${present}") || true
            exit 1
          fi
          if grep -E '\.(cdx\.json|intoto\.jsonl)$' <<<"${present}"; then
            echo "::error::SBOM / attestation bundle files must never be release assets"
            exit 1
          fi
      # The attestation is stored in GitHub's attestation store (verify:
      # `gh attestation verify <file> --repo <owner>/<repo>`); its local
      # bundle file (outputs.bundle-path) is deliberately NOT published.
      - name: Build provenance attestation (every asset in SHA256SUMS)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      # Idempotent: the first run creates the release; a re-run of the same
      # tag (the release already exists) rewrites its notes and replaces every
      # asset (--clobber) instead of failing. Any `gh release view` failure
      # other than "release not found" stops the job without publishing.
      - name: Publish the GitHub Release (create, or update on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # vX.Y.Z-N (release counter) is a full release; only -rc.N /
          # -alpha.N / -beta.N are GitHub prereleases (check-versions.sh
          # already rejected every other form).
          prerelease=()
          if [[ "${TAG}" =~ -(rc|alpha|beta)\.[0-9]+$ ]]; then prerelease=(--prerelease); fi
          repo=(--repo "${GITHUB_REPOSITORY}")
          if assets="$(gh release view "${TAG}" "${repo[@]}" --json assets -q '.assets[].name' 2>view.err)"; then
            echo "Release ${TAG} exists (re-run): updating its notes and replacing its assets"
            gh release edit "${TAG}" "${repo[@]}" --verify-tag --title "${TAG}" \
              --notes-file notes/notes.md "${prerelease[@]}"
            gh release upload "${TAG}" release/* "${repo[@]}" --clobber
            # Assets of an earlier run that this build no longer produces are
            # not in SHA256SUMS: flag them, never delete them automatically.
            while IFS= read -r name; do
              [[ -z "${name}" || -f "release/${name}" ]] ||
                echo "::warning::asset '${name}' on ${TAG} is not part of this build (not in SHA256SUMS)"
            done <<<"${assets}"
          elif grep -q "release not found" view.err; then
            gh release create "${TAG}" release/* "${repo[@]}" \
              --verify-tag --title "${TAG}" --notes-file notes/notes.md "${prerelease[@]}"
          else
            echo "::error::gh release view ${TAG} failed: $(cat view.err)"
            exit 1
          fi
