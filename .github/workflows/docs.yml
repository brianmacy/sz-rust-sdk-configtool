name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job only reads; Pages/OIDC write is granted to
# the deploy job alone.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; rustup installs it on demand.
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - name: Build Rust Documentation
        run: cargo doc --no-deps --document-private-items

      - name: Prepare Documentation Directory
        run: |
          mkdir -p _site
          # Copy pre-built index and C API docs
          cp -r docs/* _site/
          # Copy Rust docs
          cp -r target/doc _site/rust

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
